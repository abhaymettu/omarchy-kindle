# Minimal bring-up config: one headless 1072x1448 output, no effects that cost CPU on llvmpipe.
monitor = KINDLE, 1072x1448@10, 0x0, 1
monitor = FALLBACK, disable
exec-once = hyprctl output create headless KINDLE && hyprctl reload

input {
    touchdevice {
        output = KINDLE
    }
}

animations {
    enabled = false
}
decoration {
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
cursor {
    no_hardware_cursors = true
}

debug {
    disable_logs = false
    enable_stdout_logs = true
}

xwayland {
    enabled = false
}
